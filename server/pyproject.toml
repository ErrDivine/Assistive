[project]
name = "rail-server"
version = "0.1.0"
description = "Reference Rail local server: indexes Python APIs and your own code, answers context queries with verified cards."
requires-python = ">=3.10"
dependencies = [
    "griffe==2.3.0",
    "fastembed==0.8.1",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.3.5; python_version >= '3.11'",
    "pydantic==2.13.5",
    "pathspec==1.1.1",
]

[project.scripts]
rail-server = "rail_server.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rail_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
