<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}}; font-src {{cspSource}};" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>Reference Rail</title>
</head>
<body>
  <details id="frequent" hidden><summary>Frequent (<span class="count">0</span>)</summary><div class="cards"></div></details>
  <section id="pinned" hidden><h3>Pinned (<span class="count">0</span>)</h3><div class="cards"></div></section>
  <section id="live"><div class="cards"></div></section>
  <div id="empty">Move the cursor onto a Python symbol, or press Ctrl+Alt+/ to ask.</div>
  <footer id="status">Starting…</footer>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
